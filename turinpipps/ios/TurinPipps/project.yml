name: TurinPipps
options:
  bundleIdPrefix: it.maben
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TurinPipps:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.maben.turinpipps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: TurinPipps
    dependencies:
      - target: TurinPippsWidget
  TurinPippsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Widget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.maben.turinpipps.widget
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  TurinPipps:
    build:
      targets:
        TurinPipps: all
        TurinPippsWidget: all
