name: TurinPipps UI and theme quality
on:
  push:
    paths:
      - 'turinpipps/**'
      - '.github/workflows/turinpipps-ui-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turinpipps-ui-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: "Check ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        suite: [bundle, v12, v13, v14, v15, v16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run check
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.suite }}" = "bundle" ]; then
            node turinpipps/scripts/build-css.cjs --check 2>&1 | tee qa-report.txt
          else
            node --test "turinpipps/tests/${{ matrix.suite }}-"*.test.cjs 2>&1 | tee qa-report.txt
          fi
      - name: Keep QA output for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turinpipps-qa-${{ matrix.suite }}
          path: qa-report.txt
          if-no-files-found: ignore
          retention-days: 2
