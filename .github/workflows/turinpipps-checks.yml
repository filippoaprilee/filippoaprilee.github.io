name: TurinPipps checks
on:
  push:
    paths:
      - 'turinpipps/**'
      - '.github/workflows/turinpipps-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test matching, trust assumptions and frontend links
        run: node --test turinpipps/tests/v10-matching.test.cjs
