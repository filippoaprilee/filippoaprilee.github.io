name: TurinPipps - raccolta annunci
# Raccolta automatica gestita da Google Apps Script; evita run falliti su account billing bloccato.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: turinpipps-collect
  cancel-in-progress: false
jobs:
  collect:
    name: Raccolta fonti e avvisi ufficiali
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile turinpipps/collector.py turinpipps/alerts_ingest.py
      - name: Leggi solo fonti pubbliche consentite
        run: python3 turinpipps/collector.py
      - name: Importa avvisi email Subito, Immobiliare.it e altri
        env:
          TURINPIPPS_IMAP_HOST: ${{ vars.TURINPIPPS_IMAP_HOST || 'imap.gmail.com' }}
          TURINPIPPS_IMAP_PORT: '993'
          TURINPIPPS_IMAP_USER: ${{ secrets.TURINPIPPS_IMAP_USER || secrets.TURINPIPPS_SMTP_USER }}
          TURINPIPPS_IMAP_PASSWORD: ${{ secrets.TURINPIPPS_IMAP_PASSWORD || secrets.TURINPIPPS_SMTP_PASSWORD }}
        run: python3 turinpipps/alerts_ingest.py
      - name: Pubblica dati e diagnostica in GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- turinpipps/data/listings.json turinpipps/data/diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "TurinPipps: aggiornamento annunci"
            git push origin HEAD:filippoaprilee
          fi
