name: TurinPipps browser QA
on:
  push:
    branches: [turinpipps-v20-ux-foundation]
    paths:
      - 'turinpipps/**'
      - '.github/workflows/turinpipps-visual-qa.yml'
  workflow_dispatch:
concurrency:
  group: turinpipps-v20-visual-smoke
  cancel-in-progress: true
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Verify CSS bundle is generated from its sources
        run: node turinpipps/scripts/build-css.cjs --check
      - name: Serve the checked-out application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory turinpipps > /tmp/turinpipps-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/turinpipps-server.log
          exit 1
      - name: Visual and interaction smoke tests
        run: node turinpipps/scripts/visual-smoke.cjs
      - name: Attach screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turinpipps-v20-qa-screenshots
          path: turinpipps/qa-v20/
          retention-days: 7
